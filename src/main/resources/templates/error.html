<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Error')}" />
<body class="theme-iti academy-page">
<div th:replace="~{fragments :: header}"></div>

<main class="academy-container container">
    <section class="panel shadow-sm">
        <h1>Something went wrong</h1>
        <p>We encountered an error while processing your request.</p>
        <div class="error-details">
            <p><strong>Status:</strong> <span th:text="${status}">500</span></p>
            <p><strong>Error:</strong> <span th:text="${error}">Internal Server Error</span></p>
            <p><strong>Message:</strong> <span th:text="${message}">Unexpected error</span></p>
            <p><strong>Root Cause:</strong> <span th:text="${rootCause}">Unknown</span></p>
        </div>
        <a class="btn cta" th:href="@{/}">Return Home</a>
    </section>
</main>

<div th:replace="~{fragments :: footer}"></div>
</body>
</html>
