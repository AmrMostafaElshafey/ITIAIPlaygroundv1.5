<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Service Setup Wizard')}" />
<body class="theme-iti">
<div th:replace="~{fragments :: header}"></div>

<main class="container">
    <div class="page-header">
        <div>
            <h1>Service Setup Wizard</h1>
            <p>Quickly add the initial AI services for ITI staff and students.</p>
        </div>
    </div>

    <form class="form" th:action="@{/setup/services}" th:object="${service}" method="post">
        <label>Service Name
            <input type="text" th:field="*{name}" placeholder="AI Tutor" required />
        </label>
        <label>Owner Name
            <input type="text" th:field="*{ownerName}" placeholder="AI Governance Team" required />
        </label>
        <label>Category
            <input type="text" th:field="*{category}" placeholder="Education" />
        </label>
        <label>Status
            <input type="text" th:field="*{status}" placeholder="Active" />
        </label>
        <label>Eligibility
            <select th:field="*{eligibility}">
                <option value="STUDENT">Student</option>
                <option value="STAFF">Staff</option>
                <option value="BOTH">Both</option>
            </select>
        </label>
        <label>Description
            <textarea th:field="*{description}" rows="4" placeholder="Describe the service and its usage policy."></textarea>
        </label>
        <button class="btn primary" type="submit">Add Service</button>
    </form>

    <section class="services">
        <h2>Current Services</h2>
        <div class="grid">
            <div class="card" th:each="existing : ${services}">
                <h4 th:text="${existing.name}">Service Name</h4>
                <p th:text="${existing.description}">Service description.</p>
                <p><strong>Eligibility:</strong> <span th:text="${existing.eligibility}"></span></p>
            </div>
            <div class="empty" th:if="${#lists.isEmpty(services)}">
                No services configured yet.
            </div>
        </div>
    </section>
</main>

<div th:replace="~{fragments :: footer}"></div>
</body>
</html>
