<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('ITI AI Usage Policy')}" />
<body class="theme-iti">
<div th:replace="~{fragments :: header}"></div>

<main class="container narrow">
    <h1 th:text="${policy.title != null ? policy.title : 'ITI AI Usage Policy'}"></h1>
    <p th:text="${policy.summary != null ? policy.summary : 'This page provides the complete ITI AI usage policy summary for staff and students.'}"></p>
    <div class="notice" th:if="${policy.linkUrl == null}">
        Policy link is not yet configured. Use the installation wizard to set the policy details.
    </div>
    <a class="link" th:if="${policy.linkUrl != null}" th:href="${policy.linkUrl}">Open Full Policy Document</a>
</main>

<div th:replace="~{fragments :: footer}"></div>
</body>
</html>
