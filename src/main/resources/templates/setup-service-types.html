<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Installation Wizard - Service Types')}" />
<body class="theme-iti academy-page">
<div th:replace="~{fragments :: header}"></div>

<main class="academy-container container">
    <section class="panel shadow-sm">
        <h1>Installation Wizard - Step 3</h1>
        <p>Add available AI service types.</p>

        <form class="form" th:action="@{/setup/install/service-types}" th:object="${serviceType}" method="post">
            <label>Name
                <input type="text" th:field="*{name}" required />
            </label>
            <label>Description
                <input type="text" th:field="*{description}" />
            </label>
            <button class="btn cta" type="submit">Add Service Type</button>
        </form>

        <div class="grid">
            <div class="card" th:each="type : ${serviceTypes}">
                <h4 th:text="${type.name}">Type</h4>
                <p th:text="${type.description}"></p>
            </div>
        </div>

        <div class="wizard-nav">
            <a class="btn outline" th:href="@{/setup/install/policy}">Back: Policy</a>
            <a class="btn outline" th:href="@{/setup/install/services}">Next: Services</a>
        </div>
    </section>
</main>

<div th:replace="~{fragments :: footer}"></div>
</body>
</html>
